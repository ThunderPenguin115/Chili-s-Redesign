<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../../shared/global.css">
    <link rel="stylesheet" href="checkout.css" type="text/css">

    <title>Checkout Template</title>
</head>
<body>

    <header>
        <div class="left">
            <img src="../../assets/logo.webp" alt="logo">
            <a href="index.html"><h3>Chilis</h3></a>
            <a href="/pages/Menu/"><h3>Menu</h3></a>
            <a href="/pages/Checkout/"><h3>Checkout</h3></a>
        </div>

        <div class="right">
            <search><input type="search" placeholder="search"></search>
            <button id="cart"><img src="../../assets/cart.png" alt="cart"></button>
        </div>
    </header>
    
    <section class="main">
        <!-- List of products in cart -->
        <aside class="cart">
            <div class="cart-items"></div>
            <div class="cart-items"></div>
            <div class="cart-items"></div>
        </aside>
        

        <aside class="info-container">
            <div class="info">
              <p><strong>Shipping Information</strong></p>
              <div class="PersonalInfo">
                <div>
                    <p>Full Name</p>
                    <input required type="text" placeholder="Full Name">
                </div>
                <div>
                    <p>Address</p>
                    <input required type="text" placeholder="Address">
                </div>
                <div>
                    <p>Phone Number</p>
                    <input required type="number" placeholder="Phone Number">
                </div>
              </div>
              <div class="locationInfo">
                <div>
                    <p>City</p>
                    <input required type="text" placeholder="City">
                </div>
                <div>
                    <p>State</p>
                    <select name="states" id="states">
                        <option value="states">Select State</option>
                        
                    </select>
                </div>
                <div>
                    <p>Zip Code</p>
                    <input required type="number" placeholder="Zip Code">
                </div>
              </div>
                
            </div>
            <div class="cardInfo">
                <p><strong>Card Information</strong></p>

                <div>
                    <p>Cardholder Name</p>
                     <input type="text" placeholder="Cardholder Name">
                </div>
                <div>
                    <p>Card Number</p>
                    <input type="number" placeholder="Card Number">
                </div>
                <div>
                    <p>Expiration Date</p>
                    <input type="number" placeholder="MM/YY">
                </div>
                <div>
                    <p>CVV</p>
                    <input type="number" placeholder="CVV">
                </div>
                
                
                
                
            </div>
            <div class="coupons">
                <p><strong>Coupon Code</strong></p>
                <input id="potentialCode" type="text" placeholder="Enter Coupon Code">
                <!-- <button onClick="applyCouponCode()">Apply</button> -->
                <button id="applyCoupon">Apply</button>
            </div>
            
        </aside>
        
    </section>
    <section class="total">
        <h1 id="totalPrice">Total: $0.00</h1>
        <div class="button-container">
                <button id="checkout-button">Checkout</button>
            </div>  
    </section>
    
    <script rel="script" src="../../data/menu.js"></script>
    <script rel="script" src="../../data/checkout.js"></script>


     <footer>
        <p> &copy;2026 Xavier Guerrero, Matthew Beuno, & Pedro Arvayo</p>
    </footer>
</body>
</html>
